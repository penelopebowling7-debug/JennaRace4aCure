<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register - Jenna's Racing for a Cure</title>
<meta name="description" content="Register your details and request tickets for Jenna's Racing for a Cure, a race day fundraiser in support of breast cancer research, care and support.">

<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400&family=Playfair+Display:ital,wght@1,600;1,700&display=swap">
<link rel="stylesheet" href="styles.css?v=5">
</head>
<body>

<div id="toast-wrap"></div>

<div class="register-page">
  <div class="register-hero">
    <div class="brand-mark"><img src="ribbon-header.png" alt=""></div>
    <h1 id="hero-title">Loading...</h1>
    <p class="tagline" id="hero-tagline"></p>
    <div id="hero-countdown-wrap"></div>
  </div>
  <div class="register-card-outer">
    <div class="register-card" id="register-content">Loading...</div>
  </div>
</div>

<!-- Firebase (compat SDK, works with plain <script> tags, no build step needed) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<!-- Your Firebase project's own config, see README.md -->
<script src="firebase-config.js"></script>

<script>
(function () {
"use strict";

var db = firebase.firestore();
var content = document.getElementById("register-content");
var settings = null;

function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function money(n) {
  n = Number(n) || 0;
  return "$" + n.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

function fmtDate(iso) {
  if (!iso) return "";
  var d = new Date(iso + "T00:00:00");
  if (isNaN(d.getTime())) return iso;
  return d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
}

function daysUntil(iso) {
  var target = new Date(iso + "T00:00:00");
  var now = new Date();
  var todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((target - todayMid) / 86400000);
}

function toast(msg) {
  var wrap = document.getElementById("toast-wrap");
  if (!wrap) return;
  var el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(function () { el.remove(); }, 3200);
}

function renderHero() {
  document.getElementById("hero-title").textContent = settings.eventName || "Racing for a Cure";
  document.getElementById("hero-tagline").textContent = settings.tagline || "";
  var days = settings.eventDate ? daysUntil(settings.eventDate) : null;
  var countdownWrap = document.getElementById("hero-countdown-wrap");
  if (days === null) { countdownWrap.innerHTML = ""; return; }
  var daysLabel = days > 0 ? "days to go" : (days === 0 ? "It's today!" : "since the event");
  var daysNum = days > 0 ? days : Math.abs(days);
  countdownWrap.innerHTML =
    '<div class="hero-date">' + esc(fmtDate(settings.eventDate)) + "</div>" +
    (days === 0 ? "" : '<div class="hero-countdown">' + daysNum + '</div><div class="hero-countdown-lbl">' + daysLabel + "</div>");
}

function dueDateBanner(extra) {
  if (!settings.paymentDueDate) return "";
  return '<div class="banner warn" style="margin:' + (extra || "14px 0 0") + '"><strong>Payment due ' + esc(fmtDate(settings.paymentDueDate)) + '</strong> — getting this in by then really helps us finalise the day, thank you!</div>';
}

function renderForm() {
  var price = Number(settings.ticketPrice) || 0;
  content.innerHTML =
    '<h2>Request your tickets</h2>' +
    '<p class="muted" style="font-size:13.5px">' + money(price) + ' per ticket. Once you register, we will show you how to pay to secure your spot.</p>' +
    dueDateBanner("0 0 4px") +
    '<form id="register-form" class="form-grid" style="margin-top:14px">' +
      '<div class="field" style="grid-column:1/-1"><label>Name *</label><input name="name" required placeholder="Your name"></div>' +
      '<div class="field" style="grid-column:1/-1"><label>Email *</label><input name="email" type="email" required placeholder="you@email.com"></div>' +
      '<div class="field" style="grid-column:1/-1"><label>Phone</label><input name="phone" type="tel" placeholder="04xx xxx xxx"></div>' +
      '<div class="field"><label>Tickets</label><input name="tickets" type="number" min="1" max="20" value="1"></div>' +
      '<div class="field" style="grid-column:1/-1"><label>Notes</label><input name="notes" placeholder="Accessibility needs, plus one, etc"></div>' +
      '<div class="field" style="grid-column:1/-1"><button type="submit" class="btn" style="width:100%;justify-content:center">' + icon("ticket") + " Request tickets</button></div>" +
    "</form>";
  document.getElementById("register-form").addEventListener("submit", onSubmit);
}

function icon(name) {
  if (name === "ticket") return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:2px"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4V8Z"/></svg>';
  return "";
}

function renderThankYou(name, tickets) {
  var price = Number(settings.ticketPrice) || 0;
  var total = price * tickets;
  var paymentInfo = settings.paymentInfo || "The organiser will be in touch with payment details.";
  content.innerHTML =
    '<h2>Thanks, ' + esc(name) + '!</h2>' +
    '<p style="text-align:center">Your request for ' + tickets + (tickets === 1 ? " ticket" : " tickets") + ' (' + money(total) + ') has been sent through.</p>' +
    '<div class="divider"></div>' +
    '<p class="muted" style="font-size:13px;margin-bottom:6px;text-align:center">To complete your booking, please pay using:</p>' +
    '<div class="template-box">' + esc(paymentInfo) + '</div>' +
    '<p class="muted" style="font-size:12.5px;margin-top:10px;text-align:center">Please use <strong>' + esc(name) + '</strong> as your payment reference so we can match it to your registration.</p>' +
    dueDateBanner("16px 0 0");
}

function onSubmit(e) {
  e.preventDefault();
  var f = e.target;
  var name = f.name.value.trim();
  var email = f.email.value.trim();
  if (!name || !email) return;
  var tickets = Math.max(1, Math.min(20, parseInt(f.tickets.value, 10) || 1));
  var btn = f.querySelector("button[type=submit]");
  btn.disabled = true;
  btn.textContent = "Sending...";

  var ref = db.collection("attendees").doc();
  var data = {
    id: ref.id,
    name: name,
    email: email,
    phone: f.phone.value.trim(),
    tickets: tickets,
    status: "invited",
    amountPaid: 0,
    notes: f.notes.value.trim(),
    dateAdded: new Date().toISOString().slice(0, 10)
  };
  ref.set(data).then(function () {
    renderThankYou(name, tickets);
  }).catch(function (err) {
    console.error(err);
    toast("Something went wrong, please try again.");
    btn.disabled = false;
    btn.textContent = "Request tickets";
  });
}

db.collection("settings").doc("event").get().then(function (doc) {
  settings = doc.exists ? doc.data() : {};
  renderHero();
  renderForm();
}).catch(function (err) {
  console.error(err);
  document.getElementById("hero-title").textContent = "Something went wrong";
  content.innerHTML = '<p class="muted" style="text-align:center">Could not load event details, please try again shortly.</p>';
});
})();
</script>
</body>
</html>
